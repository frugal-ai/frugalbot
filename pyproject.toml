[project]
name = "frugalbot"
version = "0.1.0"
requires-python = ">=3.14"
description = "The minimal context agent"
readme = "README.md"
dependencies = [
    "aiofiles>=25.1.0",
    "any-llm-sdk[all]>=1.13.0",
    "cachier>=4.2.0",
    "dotenv>=0.9.9",
    "google-genai>=1.73.1",
    "httpx>=0.28.1",
    "ignore-python>=0.3.3",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mcp>=1.27.1",
    "orjson>=3.11.8",
    "pathspec>=1.1.0",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "pyperclip>=1.11.0",
    "pytest-asyncio>=1.3.0",
    "python-frontmatter>=1.1.0",
    "rapidfuzz>=3.14.5",
    "textual>=8.2.4",
    "textual-dev>=1.8.0",
    "tomli-w>=1.2.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
    "typer>=0.24.1",
]

[project.scripts]
frugalbot = "frugalbot.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pyfakefs>=6.2.0",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.7",
    "types-jsonschema>=4.26.0.20260508",
]

[tool.ruff]
line-length = 210

[tool.ruff.lint]
# E: Error, F: Pyflakes, I: Isort, UP: Pyupgrade, B: Bugbear, 
# N: Naming, PTH: Pathlib, TID: Tidy Imports, RUF: Ruff-internal
select = ["E", "F", "I", "UP", "B", "N", "PTH", "TID", "RUF"]

# Safe auto-fixes: 'I' for imports, 'UP' for syntax updates, 
# 'E' for standard errors (like None comparisons), and 'RUF' for ruff-specifics.
fixable = ["E", "I", "UP", "RUF"]
exclude = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
preview = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types",
    "ignore:codecs.open():DeprecationWarning",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard" # Recommended baseline; use "strict" for greenfield libs
reportUnusedImport = "error"
reportUntypedFunctionDecorator = "error"
reportPropertyTypeMismatch = "error"
