name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Install clipboard and virtual display utilities on Ubuntu only
      - name: Install Linux clipboard dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xvfb

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff check
        run: uv run ruff check

      - name: Run Pyright
        run: uv run pyright

      # Linux needs a virtual display (xvfb) for clipboard operations
      - name: Run Pytest (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest

      # Windows runs pytest directly
      - name: Run Pytest (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest